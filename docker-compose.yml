version: "3.9"

services:
  api:
    build: .
    container_name: fresh-scanner-api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis — 향후 캐싱/세션 관리용 (현재는 선택사항)
  redis:
    image: redis:7-alpine
    container_name: fresh-scanner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - with-cache

volumes:
  redis_data:
