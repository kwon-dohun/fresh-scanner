# FreshScanner Fruit Quality Classification Config
model:
  base_architecture: resnet18
  pretrained: true
  num_classes: 4
  class_names: ["특품", "상품", "보통", "하품"]

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  img_size: 224
  early_stopping_patience: 10

augmentation:
  random_brightness: 0.2
  random_contrast: 0.2
  horizontal_flip_prob: 0.5
  rotation_degrees: 15
